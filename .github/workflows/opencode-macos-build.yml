name: fix-opencode macOS build (temporary)

# Temporary verification build for the fix-opencode branch: the local machine
# has no Xcode. Runs once when this file changes; remove before merging.
on:
  push:
    branches: [fix-opencode]
    paths: [".github/workflows/opencode-macos-build.yml"]

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.0"
  RUST_TOOLCHAIN: nightly-2026-06-01

jobs:
  macos-arm64:
    name: Pocket-Codex macOS arm64 (fix-opencode)
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: fix-opencode-macos-arm64
      - name: Activate desktop manifest
        working-directory: apps/flutter
        run: cp pubspec-desktop.yaml pubspec.yaml
      - name: Build macOS app
        working-directory: apps/flutter
        env:
          FLUTTER_XCODE_ARCHS: arm64
          FLUTTER_XCODE_ONLY_ACTIVE_ARCH: "NO"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_LTO: "false"
        run: |
          set -euo pipefail
          flutter pub get
          flutter build macos --release
      - name: Package
        working-directory: apps/flutter
        run: |
          set -euo pipefail
          rel="build/macos/Build/Products/Release"
          codesign --verify --deep --strict "$rel/pocket_codex.app"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$rel/pocket_codex.app" dist/PocketCodex-fix-opencode-macos-arm64.zip
          (cd dist && shasum -a 256 *.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: PocketCodex-fix-opencode-macos-arm64
          path: |
            apps/flutter/dist/PocketCodex-fix-opencode-macos-arm64.zip
            apps/flutter/dist/SHA256SUMS.txt
          if-no-files-found: error
