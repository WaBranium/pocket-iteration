name: fix-opencode Android build (temporary)

# Temporary verification build for the fix-opencode branch (no local Android
# SDK/NDK). Debug-signed because this repository has no release keystore.
# Runs once when this file changes; remove before merging.
on:
  push:
    branches: [fix-opencode]
    paths: [".github/workflows/opencode-android-build.yml"]

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.0"
  RUST_TOOLCHAIN: nightly-2026-06-01

jobs:
  android:
    name: Pocket-Codex Android APK (fix-opencode)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true
      - uses: Swatinem/rust-cache@v2
        with:
          key: fix-opencode-android
      - name: Build APKs (split per ABI, debug-signed)
        working-directory: apps/flutter
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi
      - name: Verify and package
        working-directory: apps/flutter
        run: |
          set -euo pipefail
          src="build/app/outputs/flutter-apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            python3 ../../scripts/verify_android_apk.py --abi "$abi" "$src/app-$abi-release.apk"
          done
          mkdir -p dist
          cp "$src"/app-*-release.apk dist/
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: PocketCodex-fix-opencode-android
          path: apps/flutter/dist/*
          if-no-files-found: error
